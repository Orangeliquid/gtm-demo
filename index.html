<!DOCTYPE html>
<html>
<head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-56QM2HRB');</script>
    <!-- End Google Tag Manager -->

    <title>GTM Demo</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            margin: 0;
        }
    </style>
    
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-56QM2HRB"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <h1 id="product-name">Super Widget</h1>
    <span id="product-price">19.99</span>
    <button id="send-data-btn">Send Product Data</button>
    
    <!-- Push product data into GTM dataLayer on page load -->
    <script>
        window.dataLayer = window.dataLayer || [];

        window.addEventListener('load', function () {
            const nameElement = document.getElementById('product-name');
            const priceElement = document.getElementById('product-price');

            window.dataLayer.push({
                event: 'productView',
                product_name: nameElement ? nameElement.innerText : null,
                product_price: priceElement ? priceElement.innerText : null
            });
        });
    </script>

    <script>
        document.getElementById('send-data-btn').addEventListener('click', async function () {
            const dataLayer = window.dataLayer || [];

            // Find the productView event
            const productEvent = dataLayer.find(item => item.event === 'productView');

            // Early fallback if we fail to find productView in dataLayer
            if (!productEvent) {
                console.error('productView event not found in dataLayer')
                return;
            }

            // Build the payload
            const payload = {
                product_name: productEvent.product_name,
                product_price: productEvent.product_price
            };

            // Attempt to POST payload -> log response or catch error
            try {
                const response = await fetch('https://httpbin.org/post', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                // Throw if we don't receive 2xx status code
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`)
                }

                const data = await response.json();
                
                // Print output to console
                console.log('Response payload:', data.json)
            
            // Catch network errors 
            } catch (error) {
                console.error('Request failed:', error);
            }
        });
    </script>

</body>
</html>
