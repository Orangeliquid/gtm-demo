<!DOCTYPE html>
<html>
<head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-56QM2HRB');</script>
    <!-- End Google Tag Manager -->

    <title>GTM Demo</title>
    <style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        margin: 0;
    }
</style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-56QM2HRB"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <h1 id="product-name">Super Widget</h1>
    <span id="product-price">19.99</span>
    
    <!-- Push product data into GTM dataLayer on page load -->
    <script>
        window.dataLayer = window.dataLayer || [];

        window.addEventListener('load', function () {
            const nameElement = document.getElementById('product-name');
            const priceElement = document.getElementById('product-price');

            window.dataLayer.push({
                event: 'productView',
                product_name: nameElement ? nameElement.innerText : null,
                product_price: priceElement ? priceElement.innerText : null
            });
        });
    </script>

</body>
</html>
